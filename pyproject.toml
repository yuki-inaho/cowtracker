[project]
name = "cowtracker"
version = "0.1.0"
description = "CoWTracker: Tracking by Warping instead of Correlation (with a uv toolkit for inference, TAP-Vid evaluation and Rerun export)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # CUDA 12.8 builds include sm_120 (RTX 50xx / Blackwell); resolved from the pytorch-cu128 index below.
    "torch==2.7.0",
    "torchvision==0.22.0",
    "xformers==0.0.30",
    # timm 1.0.26+ passes `is_causal` to attention modules; upstream FlashAttention3.forward(x, attn_mask) predates that.
    "timm==1.0.25",
    "numpy",
    "scipy",
    "einops",
    "opencv-python",
    "pillow",
    "mediapy",
    "matplotlib",
    "huggingface_hub",
    "rerun-sdk==0.23.1",
]

[project.scripts]
cow-track = "cowtracker.toolkit.track_cli:main"
cow-rerun = "cowtracker.toolkit.rerun_cli:main"
cow-eval-tapvid = "cowtracker.toolkit.eval_cli:main"
cow-video = "cowtracker.toolkit.video_cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
xformers = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cowtracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: needs CUDA and the released checkpoint (COWTRACKER_CHECKPOINT)"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["cowtracker/thirdparty"]
